<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hasil Pra-Tes - Wiwitan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope&family=Red+Hat+Display:wght@700&display=swap"
    rel="stylesheet">
  <style>

    .email_container {
      display: grid;
      place-content: center;
    }

    .email_wrapper {
      display: grid;
      grid-auto-flow: row;
      place-content: center;
      max-width: 306px;
      text-align: left;
    }

    .email_wrapper .logo {
      display: flex;
      gap: 16px;
      align-content: center;
      align-self: center;
      justify-content: center;
    }

    .email_wrapper .logo .wiwitan {
      height: 80px;
    }

    .email_wrapper .badge {
      display: flex;
      justify-content: center;
      margin-top: 24px;
      margin-bottom: 8px;
    }

    .email_wrapper .badge span {
      font-family: "Manrope";
      font-size: 12px;
      font-weight: 600;
      color: #8A5A16;
      background-color: #FBEFDA;
      padding: 4px 12px;
      border-radius: 100px;
    }

    .email_wrapper .status {
      font-family: "Manrope";
      font-size: 20px;
      line-height: 27px;
      font-weight: 600;
      letter-spacing: -0.07px;
      margin-bottom: 16px;
      text-align: center;
    }

    .email_wrapper .description {
      font-family: "Manrope";
      font-size: 14px;
      line-height: 19px;
      margin-bottom: 24px;
      text-align: center;
    }
  </style>
</head>

<body class="email_container">
  <main class="email_wrapper">
    <div class="logo">
      <img class="wiwitan"
        src="https://api.wiwitanbaru.com/images/wiwitan-logo.png"
        alt="Wiwitan Logo" width="64" height="80" />
    </div>
    <div class="badge"><span>Hasil Pra-Tes</span></div>
    <div class="status">Halo, {{.name}}</div>
    <div class="description">
      Mohon maaf, kamu belum lulus Sesi Tanya Jawab. Silakan hubungi admin lewat aplikasi Wiwitan untuk informasi lebih lanjut.
    </div>
  </main>
</body>

</html>
