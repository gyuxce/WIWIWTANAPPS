<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activate Account - Wiwitan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope&family=Red+Hat+Display:wght@700&display=swap"
    rel="stylesheet">
  <style>

    .email_container {
      display: grid;
      place-content: center;
      /* min-height: 100vh; */
    }

    .email_wrapper {
      display: grid;
      grid-auto-flow: row;
      place-content: center;
      max-width: 306px;
      text-align: left;
    }

    .email_wrapper .logo {
      display: flex;
      gap: 16px;
      align-content: center;
      align-self: center;
      justify-content: center;
    }

    .email_wrapper .logo .wiwitan {
      height: 80px;
    }

    .email_wrapper .status {
      font-family: "Manrope";
      font-size: 20px;
      line-height: 27px;
      font-weight: 600;
      letter-spacing: -0.07px;
      margin-top: 24px;
      margin-bottom: 16px;
      text-align: center;
    }

    .email_wrapper .description {
      font-family: "Manrope";
      font-size: 14px;
      line-height: 19px;
      margin-bottom: 24px;
    }

    .email_wrapper .button {
      display: flex;
      justify-content: center;
      margin-bottom: 36px;
      text-align: center;
    }

    .email_wrapper a {
      font-family: "Manrope";
      width: 162px;
      background-color: #0D3AA1;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      color: white;
      text-decoration: none;
      margin-bottom: 8px;
    }
  </style>
</head>

<body class="email_container">
  <main class="email_wrapper">
    <div class="logo">
      <img class="wiwitan"
        src="https://api.wiwitanbaru.com/images/wiwitan-logo.png"
        alt="Wiwitan Logo" width="64" height="80" />
    </div>
    <div class="status">Activate Your Account</div>
    <div class="description">
      You can activate your account by clicking the “Activate Now” button below
    </div>
    <div class="button">
      <a href="{{.url}}">Activate Account Here</a>
    </div>
  </main>
</body>

</html>
