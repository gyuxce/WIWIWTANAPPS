// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36

        ndkVersion = "28.2.13676358"
        kotlinVersion = '2.0.21'
        kspVersion = '2.0.21-1.0.28'
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven { url "https://www.jitpack.io" }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.5.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25"
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://maven.google.com" }
        maven { url "https://www.jitpack.io" }
    }

    configurations.all {
        resolutionStrategy {
            // ... your existing Kotlin forces ...
            force "com.google.devtools.ksp:symbol-processing-api:$rootProject.ext.kspVersion"
        }
    }
}

subprojects {
    afterEvaluate { project ->
        def androidExtension = project.extensions.findByName("android")
        if (androidExtension != null) {
            def configuredAbis = (project.findProperty("reactNativeArchitectures") ?: "armeabi-v7a,arm64-v8a,x86,x86_64")
                .split(",")
                .collect { it.trim() }
                .findAll { it }
            androidExtension.packagingOptions {
                jniLibs {
                    useLegacyPackaging = false
                }
            }
            androidExtension.defaultConfig {
                externalNativeBuild {
                    cmake {
                        arguments "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384",
                            "-DCMAKE_OBJECT_PATH_MAX=128"
                    }
                }
                ndk {
                    abiFilters(*configuredAbis)
                }
            }
        }
    }
}
