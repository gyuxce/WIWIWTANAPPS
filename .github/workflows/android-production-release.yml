name: Android production release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-production-aab:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: mobile/yarn.lock

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Restore production-only files
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          MOBILE_ENV_PRODUCTION: ${{ secrets.MOBILE_ENV_PRODUCTION }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          test -n "$MOBILE_ENV_PRODUCTION"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > mobile/android/app/google-services.json
          printf '%s' "$MOBILE_ENV_PRODUCTION" > mobile/.env.production

      - name: Install JavaScript dependencies
        working-directory: mobile
        env:
          HUSKY: '0'
        run: |
          corepack enable
          yarn install --frozen-lockfile --non-interactive

      - name: Restore Android signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.MYAPP_UPLOAD_STORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.MYAPP_UPLOAD_KEY_ALIAS }}
          MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.MYAPP_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$MYAPP_UPLOAD_STORE_PASSWORD"
          test -n "$MYAPP_UPLOAD_KEY_ALIAS"
          test -n "$MYAPP_UPLOAD_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/wiwitan-upload.keystore
          {
            printf '\nMYAPP_UPLOAD_STORE_FILE=wiwitan-upload.keystore\n'
            printf 'MYAPP_UPLOAD_STORE_PASSWORD=%s\n' "$MYAPP_UPLOAD_STORE_PASSWORD"
            printf 'MYAPP_UPLOAD_KEY_ALIAS=%s\n' "$MYAPP_UPLOAD_KEY_ALIAS"
            printf 'MYAPP_UPLOAD_KEY_PASSWORD=%s\n' "$MYAPP_UPLOAD_KEY_PASSWORD"
          } >> mobile/android/gradle.properties

      - name: Build signed production AAB
        working-directory: mobile/android
        env:
          NODE_ENV: production
          ENVFILE: .env.production
        run: bash ./gradlew app:bundleProductionRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon --max-workers=2 --console=plain

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiwitan-production-aab
          path: mobile/android/app/build/outputs/bundle/productionRelease/*.aab
          if-no-files-found: error
